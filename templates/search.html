<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Search Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            background:
                radial-gradient(circle at top left, #172554, transparent 40%),
                radial-gradient(circle at bottom right, #164e63, transparent 40%),
                #080d18;

            color: white;
            overflow-x: hidden;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            width: 100%;
            padding: 16px 35px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(15px);

            border-bottom: 1px solid rgba(255, 255, 255, 0.08);

            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);

            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* LOGO */

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-decoration: none;

            transition: 0.3s;
        }

        .logo:hover {
            color: #38bdf8;
        }

        /* NAVIGATION LINKS */

        .nav-links {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-links a {
            position: relative;

            color: #e2e8f0;
            text-decoration: none;

            padding: 10px 16px;
            border-radius: 10px;

            font-size: 15px;
            font-weight: 500;

            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.12);

            transform: translateY(-2px);
        }

        .nav-links a::after {
            content: "";

            position: absolute;
            left: 50%;
            bottom: 4px;

            width: 0;
            height: 2px;

            background: #38bdf8;

            transform: translateX(-50%);
            transition: 0.3s;
        }

        .nav-links a:hover::after {
            width: 50%;
        }

        /* LOGIN */

        .login-btn {
            border: 1px solid #38bdf8;
            color: #38bdf8 !important;
        }

        .login-btn:hover {
            background: #38bdf8 !important;
            color: #08111f !important;
        }

        /* REGISTER */

        .register-btn {
            background: linear-gradient(
                135deg,
                #06b6d4,
                #3b82f6
            );

            color: white !important;

            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3);
        }

        .register-btn:hover {
            background: linear-gradient(
                135deg,
                #3b82f6,
                #8b5cf6
            );

            transform: translateY(-3px);
        }

        /* ================= SEARCH CONTAINER ================= */

        .search-container {
            min-height: calc(100vh - 80px);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 50px 20px;
        }

        .search-box {
            position: relative;

            width: 700px;
            max-width: 95%;

            padding: 55px 45px;

            text-align: center;

            background: rgba(20, 27, 43, 0.88);

            backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 255, 255, 0.08);

            border-radius: 25px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.4),
                inset 0 1px 1px rgba(255, 255, 255, 0.05);

            overflow: hidden;
        }

        /* DECORATIVE CIRCLE */

        .search-box::before {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            background: rgba(56, 189, 248, 0.12);

            border-radius: 50%;

            top: -80px;
            left: -70px;
        }

        .search-box::after {
            content: "";

            position: absolute;

            width: 220px;
            height: 220px;

            background: rgba(59, 130, 246, 0.10);

            border-radius: 50%;

            bottom: -110px;
            right: -80px;
        }

        /* HEADING */

        .search-box h1 {
            position: relative;
            z-index: 2;

            font-size: 42px;

            margin-bottom: 15px;

            background: linear-gradient(
                135deg,
                #38bdf8,
                #3b82f6,
                #8b5cf6
            );

            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* DESCRIPTION */

        .search-box p {
            position: relative;
            z-index: 2;

            color: #cbd5e1;

            font-size: 17px;

            margin-bottom: 30px;
        }

        /* SEARCH FORM */

        .search-form {
            position: relative;
            z-index: 2;

            display: flex;
            gap: 12px;

            width: 100%;
        }

        .search-form input {
            flex: 1;

            padding: 14px 18px;

            border-radius: 10px;

            border: 1px solid #374151;

            outline: none;

            background: #111827;

            color: white;

            font-size: 16px;

            transition: 0.3s;
        }

        .search-form input::placeholder {
            color: #94a3b8;
        }

        .search-form input:focus {
            border-color: #38bdf8;

            box-shadow:
                0 0 0 3px rgba(56, 189, 248, 0.12);
        }

        /* SEARCH BUTTON */

        .search-btn {
            padding: 14px 25px;

            border: none;

            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #06b6d4,
                #3b82f6
            );

            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

            box-shadow:
                0 8px 20px rgba(59, 130, 246, 0.25);
        }

        .search-btn:hover {
            background: linear-gradient(
                135deg,
                #3b82f6,
                #8b5cf6
            );

            transform: translateY(-3px);

            box-shadow:
                0 12px 25px rgba(59, 130, 246, 0.35);
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 1100px) {

            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
            }
        }

        @media (max-width: 600px) {

            .navbar {
                padding: 15px;
            }

            .logo {
                font-size: 21px;
                text-align: center;
            }

            .nav-links a {
                font-size: 13px;
                padding: 8px 10px;
            }

            .search-container {
                padding: 30px 15px;
            }

            .search-box {
                padding: 45px 20px;
            }

            .search-box h1 {
                font-size: 32px;
            }

            .search-box p {
                font-size: 15px;
            }

            .search-form {
                flex-direction: column;
            }

            .search-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <a href="#" class="logo">
            Employee Management System
        </a>

        <div class="nav-links">

            <a href="/home">Home</a>

            <a href="/employees">Employees</a>

            <a href="/add-employees">Add Employee</a>

            <a href="/search">Search</a>

            <a href="/about">About</a>

            <a href="/login" class="login-btn">
                Login
            </a>

            <a href="/register" class="register-btn">
                Register
            </a>

        </div>

    </nav>


    <!-- SEARCH PAGE -->

    <main class="search-container">

        <div class="search-box">

            <h1>
                Search Employees
            </h1>

            <p>
                Search for an employee using their name,
                username, ID or other details.
            </p>

            <form class="search-form">

                <input
                    type="text"
                    placeholder="Enter employee name or ID"
                >

                <button type="submit" class="search-btn">
                    Search
                </button>

            </form>

        </div>

    </main>

</body>
</html>
